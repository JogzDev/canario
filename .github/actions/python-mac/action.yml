name: Garantir Python no runner do Mac
description: >-
  Deixa um Python utilizavel disponivel em $PY. Usa o do sistema quando existe;
  senao instala um portatil na pasta do runner, sem senha de administrador.

  Existe porque o `actions/setup-python` nao funciona neste Mac: o script de
  instalacao do actions/python-versions tem /Users/runner fixo no codigo e
  ignora AGENT_TOOLSDIRECTORY. E o `python3` do macOS e um atalho que exige as
  Command Line Tools do Xcode, que a maquina nao tem.

outputs:
  python:
    description: Caminho do Python utilizavel
    value: ${{ steps.achar.outputs.python }}

runs:
  using: composite
  steps:
    - id: achar
      shell: bash
      run: |
        set -euo pipefail
        if python3 -c "import json,urllib.request" 2>/dev/null; then
          echo "Python do sistema serve: $(python3 --version)"
          echo "python=python3" >> "$GITHUB_OUTPUT"
          echo "PY=python3" >> "$GITHUB_ENV"
          exit 0
        fi
        if [ "$(uname -m)" != "x86_64" ]; then
          echo "Runner sem Python e arquitetura nao suportada: $(uname -m)" >&2
          exit 1
        fi

        DESTINO="$HOME/.canario-python"
        PORTATIL="$DESTINO/bin/python3"
        MARCADOR="$DESTINO/.canario-sha256"
        ARQUIVO="$HOME/.canario-python-dl/py.tar.gz"
        SHA256="dc3174666a30f4c38d04e79a80c3159b4b3aa69597c4676701c8386696811611"
        URL="https://github.com/astral-sh/python-build-standalone/releases/download/20240726/cpython-3.11.9%2B20240726-x86_64-apple-darwin-install_only.tar.gz"

        if [ ! -x "$PORTATIL" ] || [ ! -f "$MARCADOR" ] || \
           [ "$(tr -d '[:space:]' < "$MARCADOR" 2>/dev/null || true)" != "$SHA256" ]; then
          echo "Sem Python portatil verificado; instalando uma copia autenticada."
          mkdir -p "$HOME/.canario-python-dl"
          curl --proto '=https' --tlsv1.2 -fsSL -o "$ARQUIVO.tmp" "$URL"
          echo "$SHA256  $ARQUIVO.tmp" | shasum -a 256 -c -
          mv "$ARQUIVO.tmp" "$ARQUIVO"

          # O alvo e deliberadamente fixo e validado antes da remocao.
          if [ "$DESTINO" != "$HOME/.canario-python" ]; then
            echo "Destino inesperado: $DESTINO" >&2
            exit 1
          fi
          rm -rf -- "$DESTINO"
          mkdir -p "$DESTINO"
          tar xzf "$ARQUIVO" -C "$DESTINO" --strip-components=1
          echo "$SHA256" > "$MARCADOR"
        fi
        "$PORTATIL" --version
        "$PORTATIL" -c "import json,urllib.request; print('stdlib ok')"
        echo "python=$PORTATIL" >> "$GITHUB_OUTPUT"
        echo "PY=$PORTATIL" >> "$GITHUB_ENV"
