name: OpenAI — preparar revisao cega do Luna

# Este workflow NAO recebe OPENAI_API_KEY e nao chama endpoint da OpenAI. Ele
# recompõe a amostra do cache do i7, recupera categorias do log de uma execução
# passada e cria um artefato privado e temporário para rotulação humana.

on:
  workflow_dispatch:
    inputs:
      run_id:
        description: 'Run do avaliar-luna cujos logs serão recuperados'
        required: true
        default: '31452732941'
      quantidade:
        description: 'Quantidade usada naquela execução'
        required: true
        default: '24'
        type: choice
        options: ['24', '300']

permissions:
  actions: read
  contents: read

concurrency:
  group: canario-dados
  cancel-in-progress: false

jobs:
  preparar:
    runs-on: [self-hosted, macOS, X64]
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Recuperar logs da rodada sem inferencia
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ inputs.run_id }}
        run: |
          set -euo pipefail
          curl --fail --location --silent --show-error \
            --header "Authorization: Bearer $GH_TOKEN" \
            --header "Accept: application/vnd.github+json" \
            --header "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/$GITHUB_REPOSITORY/actions/runs/$RUN_ID/logs" \
            --output "$RUNNER_TEMP/luna-logs.zip"
          mkdir "$RUNNER_TEMP/luna-logs"
          unzip -q "$RUNNER_TEMP/luna-logs.zip" -d "$RUNNER_TEMP/luna-logs"

      - name: Montar pacote cego das mesmas imagens
        env:
          RUN_ID: ${{ inputs.run_id }}
          QUANTIDADE: ${{ inputs.quantidade }}
        run: |
          set -euo pipefail
          python3 ferramentas/preparar_revisao_luna.py \
            --cache "$HOME/canario-imagens-treino" \
            --logs "$RUNNER_TEMP/luna-logs" \
            --saida "$RUNNER_TEMP/revisao-luna" \
            --run-id "$RUN_ID" \
            --quantidade "$QUANTIDADE"

      - name: Publicar pacote privado por tres dias
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: luna-revisao-${{ inputs.quantidade }}-run-${{ inputs.run_id }}
          path: ${{ runner.temp }}/revisao-luna
          if-no-files-found: error
          retention-days: 3
          compression-level: 0

      - name: Resumo
        run: |
          {
            echo '## Revisao cega pronta'
            echo ''
            echo '- Imagens: `${{ inputs.quantidade }}`'
            echo '- Respostas recuperadas dos logs da run `${{ inputs.run_id }}`'
            echo '- Chamadas à OpenAI: **0**'
            echo '- O artefato privado expira em 3 dias'
            echo ''
            echo 'Baixe o artefato, extraia o ZIP e abra `revisao.html`.'
          } >> "$GITHUB_STEP_SUMMARY"
