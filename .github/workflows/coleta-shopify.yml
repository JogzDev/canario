name: Coleta residencial (Shopify ou recuperação VTEX)

# Existe por uma diferenca medida em 29/07: Amaro e PatBo devolvem 429 do
# datacenter do GitHub e 200 do IP residencial. As duas sao Shopify; as 12 VTEX
# coletam bem do datacenter. Entao a divisao de trabalho e por plataforma:
#   * coleta.yml         -> VTEX, nos servidores do GitHub
#   * coleta-shopify.yml -> Shopify, no Mac do JP (IP residencial)
#
# Amaro e nucleo e o termometro mais sensivel do painel: e a marca que mais
# justifica o Mac existir no projeto.
on:
  workflow_call:
    inputs:
      plataforma:
        description: 'Plataforma a coletar no IP residencial'
        required: false
        type: string
        default: 'shopify'
      marca:
        description: 'Coletar só uma marca (vazio = todas da plataforma)'
        required: false
        type: string
        default: ''
      segmento:
        description: 'Segmento isolado a coletar'
        required: false
        type: string
        default: 'feminino_casual_br'
      verificar_isolamento:
        description: 'Verificar segmento antes de um motor posterior'
        required: false
        type: boolean
        default: true
      rotulo_do_runner:
        description: 'Maquina que executa: sempre-ligado (i7) ou xcode (Mac do JP)'
        required: false
        type: string
        default: 'sempre-ligado'
      data_operacional:
        description: 'Data ISO da coleta encadeada (vazio = hoje em Sao Paulo)'
        required: false
        type: string
        default: ''
    secrets:
      SUPABASE_URL:
        required: true
      SUPABASE_SECRET_KEY:
        required: true
  workflow_dispatch:
    inputs:
      plataforma:
        description: 'Plataforma a coletar no IP residencial'
        required: true
        type: choice
        options:
          - shopify
          - vtex
        default: shopify
      marca:
        description: 'Coletar só uma marca (vazio = todas da plataforma)'
        required: false
        default: ''
      segmento:
        description: 'Segmento isolado a coletar'
        required: false
        default: 'feminino_casual_br'
      verificar_isolamento:
        description: 'Verificar segmento antes de um motor posterior'
        required: false
        type: boolean
        default: true
      rotulo_do_runner:
        description: 'Maquina que executa'
        required: false
        type: choice
        options:
          - sempre-ligado
          - xcode
        default: sempre-ligado
      data_operacional:
        description: 'Data ISO da coleta encadeada (vazio = hoje em Sao Paulo)'
        required: false
        default: ''

permissions:
  contents: read

concurrency:
  group: canario-dados
  cancel-in-progress: false

jobs:
  coletar:
    # O cabecalho deste arquivo diz que a perna Shopify existe por causa do IP:
    # Amaro e PatBo devolvem 429 do datacenter e 200 do residencial. O rotulo
    # virou parametro em 26/08 porque a maquina certa depende da hora -- o i7
    # fica ligado de madrugada, o Mac do JP fica ligado no horario comercial --
    # e porque um runner sozinho e ponto unico de falha para a coleta inteira.
    runs-on: [self-hosted, macOS, "${{ inputs.rotulo_do_runner || 'sempre-ligado' }}"]
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - uses: ./.github/actions/python-mac

      - name: Proteger capacidade do banco antes de escrever
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
        run: "$PY coletor/verificar_capacidade_banco.py"

      - name: Coletar plataforma pelo IP residencial
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
          COLETA_PLATAFORMA: ${{ inputs.plataforma }}
          COLETA_MARCA: ${{ inputs.marca }}
          COLETA_SEGMENTO: ${{ inputs.segmento }}
          DATA_OPERACIONAL: ${{ inputs.data_operacional }}
        run: "$PY coletor/coletor_varejo.py"

      - name: Provar isolamento do painel adicional
        if: ${{ inputs.segmento != 'feminino_casual_br' && inputs.verificar_isolamento }}
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
          SEGMENTO_VERIFICADO: ${{ inputs.segmento }}
        run: "$PY coletor/verificar_isolamento_segmento.py"
