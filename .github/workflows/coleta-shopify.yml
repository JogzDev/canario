name: Coleta Shopify e Nuvemshop ou recuperação VTEX

# A premissa residencial foi revalidada em 21/09/2026: Amaro respondeu 200 no
# Linux e no macOS gerenciados. O job usa Linux hospedado; recusas transitórias
# continuam registradas e sujeitas ao portão de saúde.
#
# Desde 23/09/2026 a Amaro está na Nuvemshop. As duas plataformas leves correm
# na mesma perna: são poucas marcas, e separar criaria mais um elo na corrente
# do pipeline sem ganho de isolamento.
on:
  workflow_call:
    inputs:
      plataforma:
        description: 'Plataformas a coletar, separadas por vírgula'
        required: false
        type: string
        default: 'shopify,nuvemshop'
      marca:
        description: 'Coletar só uma marca (vazio = todas da plataforma)'
        required: false
        type: string
        default: ''
      segmento:
        description: 'Segmento isolado a coletar'
        required: false
        type: string
        default: 'feminino_casual_br'
      verificar_isolamento:
        description: 'Verificar segmento antes de um motor posterior'
        required: false
        type: boolean
        default: true
      data_operacional:
        description: 'Data ISO da coleta encadeada (vazio = hoje em Sao Paulo)'
        required: false
        type: string
        default: ''
    outputs:
      data_operacional:
        description: 'Data propagada para a próxima perna'
        value: ${{ jobs.coletar.outputs.data_operacional }}
    secrets:
      SUPABASE_URL:
        required: true
      SUPABASE_SECRET_KEY:
        required: true
  workflow_dispatch:
    inputs:
      plataforma:
        description: 'Plataformas a coletar'
        required: true
        type: choice
        options:
          - shopify,nuvemshop
          - shopify
          - nuvemshop
          - vtex
        default: shopify,nuvemshop
      marca:
        description: 'Coletar só uma marca (vazio = todas da plataforma)'
        required: false
        default: ''
      segmento:
        description: 'Segmento isolado a coletar'
        required: false
        default: 'feminino_casual_br'
      verificar_isolamento:
        description: 'Verificar segmento antes de um motor posterior'
        required: false
        type: boolean
        default: true
      data_operacional:
        description: 'Data ISO da coleta encadeada (vazio = hoje em Sao Paulo)'
        required: false
        default: ''

permissions:
  contents: read

concurrency:
  group: canario-dados
  cancel-in-progress: false

jobs:
  coletar:
    outputs:
      data_operacional: ${{ steps.ancora.outputs.data }}
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - uses: ./.github/actions/python-mac

      - name: Fixar data operacional da execução
        id: ancora
        env:
          DATA_SOLICITADA: ${{ inputs.data_operacional }}
        run: |
          data="${DATA_SOLICITADA:-$(TZ=America/Sao_Paulo date +%F)}"
          [[ "$data" =~ ^[0-9]{4}-[0-9]{2}-[0-9]{2}$ ]]
          echo "data=$data" >> "$GITHUB_OUTPUT"

      - name: Proteger capacidade do banco antes de escrever
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
        run: "$PY coletor/verificar_capacidade_banco.py"

      - name: Coletar plataforma no executor gerenciado
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
          COLETA_PLATAFORMA: ${{ inputs.plataforma }}
          COLETA_MARCA: ${{ inputs.marca }}
          COLETA_SEGMENTO: ${{ inputs.segmento }}
          DATA_OPERACIONAL: ${{ steps.ancora.outputs.data }}
        run: "$PY coletor/coletor_varejo.py"

      - name: Provar isolamento do painel adicional
        if: ${{ inputs.segmento != 'feminino_casual_br' && inputs.verificar_isolamento }}
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
          SEGMENTO_VERIFICADO: ${{ inputs.segmento }}
        run: "$PY coletor/verificar_isolamento_segmento.py"
