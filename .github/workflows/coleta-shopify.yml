name: Coleta Shopify (runner residencial)

# Existe por uma diferenca medida em 29/07: Amaro e PatBo devolvem 429 do
# datacenter do GitHub e 200 do IP residencial. As duas sao Shopify; as 12 VTEX
# coletam bem do datacenter. Entao a divisao de trabalho e por plataforma:
#   * coleta.yml         -> VTEX, nos servidores do GitHub
#   * coleta-shopify.yml -> Shopify, no Mac do JP (IP residencial)
#
# Amaro e nucleo e o termometro mais sensivel do painel: e a marca que mais
# justifica o Mac existir no projeto.
on:
  workflow_dispatch:
  schedule:
    # 03:20 BRT, 20 minutos depois da VTEX, para as duas coletas nao disputarem
    # o mesmo minuto nem o mesmo teto de requisicao.
    - cron: '20 6 * * *'

permissions:
  contents: write

concurrency:
  group: coleta-shopify
  cancel-in-progress: false

jobs:
  coletar:
    runs-on: [self-hosted, macOS]
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4

      # `actions/setup-python` NAO funciona neste Mac: o script de instalacao
      # dentro do pacote do python-versions tem /Users/runner fixo no codigo e
      # ignora AGENT_TOOLSDIRECTORY, falhando com "Permission denied". E o
      # `python3` do sistema e um atalho que exige as Command Line Tools do
      # Xcode, que a maquina nao tem.
      #
      # Solucao sem senha de administrador: um Python portatil, extraido dentro
      # da pasta do proprio runner. Fica em cache entre execucoes.
      - name: Garantir Python (do sistema ou portatil)
        run: |
          set -euo pipefail
          if python3 -c "import json,urllib.request" 2>/dev/null; then
            echo "Python do sistema serve."
            echo "PY=python3" >> "$GITHUB_ENV"
            python3 --version
            exit 0
          fi
          echo "Sem Python utilizavel; instalando um portatil."
          PORTATIL="$HOME/.canario-python/bin/python3"
          if [ ! -x "$PORTATIL" ]; then
            mkdir -p "$HOME/.canario-python-dl"
            curl -fsSL -o "$HOME/.canario-python-dl/py.tar.gz" \
              "https://github.com/astral-sh/python-build-standalone/releases/download/20240726/cpython-3.11.9+20240726-x86_64-apple-darwin-install_only.tar.gz"
            rm -rf "$HOME/.canario-python"
            mkdir -p "$HOME/.canario-python"
            tar xzf "$HOME/.canario-python-dl/py.tar.gz" \
              -C "$HOME/.canario-python" --strip-components=1
          fi
          "$PORTATIL" --version
          "$PORTATIL" -c "import json,urllib.request; print('stdlib ok')"
          echo "PY=$PORTATIL" >> "$GITHUB_ENV"

      - name: Coletar so as marcas Shopify
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
          COLETA_PLATAFORMA: shopify
        run: "$PY coletor/coletor_varejo.py"

      - name: Commitar SAUDE.md
        if: always()
        run: >-
          bash .github/commitar.sh
          "SAUDE.md anexos/departamentos_vtex.json"
          "Relatorio de saude - Shopify no runner residencial"
