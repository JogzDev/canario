name: Recuperar fontes e publicar pipeline

# Operacao cirurgica para um dia em que as fontes externas falharam: repete
# apenas Shopify/PatBo e outro lote do Trends, aplica o mesmo portao de saude
# do cron e, se estiver verde, publica o motor. Nao refaz VTEX/editorial.
on:
  workflow_dispatch:
    inputs:
      somente_validar:
        description: 'reutilizar coletas do dia e executar apenas saude + motor'
        required: false
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: pipeline-diario
  cancel-in-progress: false

jobs:
  recuperar-shopify:
    if: ${{ inputs.somente_validar != true }}
    uses: ./.github/workflows/coleta-shopify.yml
    secrets: inherit

  recuperar-busca:
    needs: recuperar-shopify
    if: ${{ inputs.somente_validar != true }}
    uses: ./.github/workflows/coleta-trends.yml
    with:
      modo: ''
      tentativa: 1
    secrets: inherit

  saude:
    if: ${{ always() }}
    needs: [recuperar-shopify, recuperar-busca]
    runs-on: [self-hosted, macOS]
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: '3.11'

      - name: Consolidar fontes e aplicar portao de saude
        id: portao
        continue-on-error: true
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
        run: python3 coletor/gerar_saude.py

      - name: Validar recuperacao das duas fontes
        id: dependencias
        if: >-
          ${{ inputs.somente_validar != true &&
              !(needs.recuperar-shopify.result == 'success' &&
                needs.recuperar-busca.result == 'success') }}
        continue-on-error: true
        run: exit 1

      - name: Publicar relatorio unico
        if: ${{ always() && github.ref_name == 'main' }}
        run: >-
          bash .github/commitar.sh "SAUDE.md" "Saude consolidada do pipeline"

      - name: Bloquear publicacao do motor
        if: >-
          ${{ steps.portao.outcome == 'failure' ||
              steps.dependencias.outcome == 'failure' }}
        run: exit 1

  motor:
    needs: saude
    # No modo somente_validar as coletas sao puladas de proposito; o unico
    # criterio para publicar e o portao de saude imediatamente anterior.
    if: ${{ always() && needs.saude.result == 'success' }}
    uses: ./.github/workflows/motor.yml
    with:
      backfill_editorial: false
    secrets: inherit
