name: Recuperar fontes e publicar pipeline

# Operacao cirurgica para um dia em que as fontes externas falharam: repete
# apenas Shopify/PatBo e outro lote do Trends, aplica o mesmo portao de saude
# do cron e, se estiver verde, publica o motor. Nao refaz VTEX/editorial.
on:
  workflow_dispatch:
    inputs:
      somente_validar:
        description: 'reutilizar coletas do dia e executar apenas saude + motor'
        required: false
        type: boolean
        default: false
      data_operacional:
        description: 'data ISO das coletas que serao recuperadas/validadas'
        required: false
        type: string
        default: ''

permissions:
  contents: read

concurrency:
  group: pipeline-diario
  cancel-in-progress: false

jobs:
  recuperar-shopify:
    if: ${{ inputs.somente_validar != true }}
    uses: ./.github/workflows/coleta-shopify.yml
    with:
      data_operacional: ${{ inputs.data_operacional }}
    secrets: inherit

  recuperar-busca:
    needs: recuperar-shopify
    if: ${{ inputs.somente_validar != true }}
    uses: ./.github/workflows/coleta-trends.yml
    with:
      modo: ''
      tentativa: 1
      executor: macos-latest
      data_operacional: ${{ inputs.data_operacional }}
    secrets: inherit

  saude:
    if: ${{ always() }}
    needs: [recuperar-shopify, recuperar-busca]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - uses: ./.github/actions/python-mac

      - name: Consolidar fontes e aplicar portao de saude
        id: portao
        continue-on-error: true
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
          DATA_OPERACIONAL: ${{ inputs.data_operacional }}
        run: "$PY coletor/gerar_saude.py"

      - name: Validar recuperacao das duas fontes
        id: dependencias
        if: >-
          ${{ inputs.somente_validar != true &&
              !(needs.recuperar-shopify.result == 'success' &&
                needs.recuperar-busca.result == 'success') }}
        continue-on-error: true
        run: exit 1

      - name: Expor relatorio na propria execucao
        if: ${{ always() }}
        continue-on-error: true
        run: |
          if [[ -s SAUDE.md ]]; then
            cat SAUDE.md >> "$GITHUB_STEP_SUMMARY"
          else
            echo '## Saude — relatorio nao gerado' >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Guardar relatorio para download
        if: ${{ always() }}
        continue-on-error: true
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: saude-${{ github.run_id }}-${{ github.run_attempt }}
          path: SAUDE.md
          if-no-files-found: warn
          retention-days: 30

      - name: Bloquear publicacao do motor
        if: >-
          ${{ steps.portao.outcome == 'failure' ||
              steps.dependencias.outcome == 'failure' }}
        run: exit 1

  motor:
    needs: saude
    # No modo somente_validar as coletas sao puladas de proposito; o unico
    # criterio para publicar e o portao de saude imediatamente anterior.
    if: ${{ always() && needs.saude.result == 'success' }}
    uses: ./.github/workflows/motor.yml
    with:
      backfill_editorial: false
    secrets: inherit
