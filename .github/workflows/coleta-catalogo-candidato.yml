name: Coleta do catalogo candidato brasileiro

# Amplia o universo de similares sem alterar a coorte estatistica congelada.
# Cada perna reutiliza o mesmo portao de capacidade das coletas regulares.
on:
  schedule:
    # Todo dia, 08:35 BRT, depois do pipeline diario (03:17 BRT).
    #
    # Era segunda e quinta ate 23/09/2026. Diario porque o JP decidiu promover
    # as 13 candidatas ao painel medido, e a promocao precisa de duas coisas
    # que duas coletas por semana nao dao: a trava de publicacao (A60) exige
    # toda marca do painel vista todo dia, e a curva e a serie precisam de
    # historico diario antes da virada, senao a marca entra com janela vazia e
    # o salto no share parece mercado. Enquanto for candidata, nada disso toca
    # o painel. Custo medido no primeiro ciclo: ver PENDENCIAS.md.
    - cron: '35 11 * * *'
  workflow_dispatch:
    inputs:
      plataforma:
        description: 'Plataforma da marca'
        required: true
        type: choice
        options:
          - vtex
          - shopify
        default: vtex
      marca:
        description: 'Marca exata (vazio = todas da plataforma)'
        required: false
        default: ''

permissions:
  contents: read

jobs:
  vtex:
    if: ${{ github.event_name == 'schedule' || inputs.plataforma == 'vtex' }}
    uses: ./.github/workflows/coleta.yml
    with:
      segmento: catalogo_candidato_br
      marca: ${{ inputs.marca }}
      pente_fino: false
    secrets: inherit

  shopify:
    if: ${{ github.event_name == 'schedule' || inputs.plataforma == 'shopify' }}
    uses: ./.github/workflows/coleta-shopify.yml
    with:
      plataforma: shopify
      segmento: catalogo_candidato_br
      marca: ${{ inputs.marca }}
      verificar_isolamento: false
    secrets: inherit

  publicar:
    needs: [vtex, shopify]
    if: ${{ always() && (needs.vtex.result == 'success' || needs.shopify.result == 'success') }}
    uses: ./.github/workflows/motor.yml
    secrets: inherit

  verificar:
    needs: publicar
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/python-mac
      - name: Provar isolamento depois da publicação
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
          SEGMENTO_VERIFICADO: catalogo_candidato_br
        run: "$PY coletor/verificar_isolamento_segmento.py"
