name: Market Intelligence — pacote privado da Etiqueta

# Primeira materialização factual da 1.3. É manual enquanto o benchmark não
# tiver quatro semanas. Lê uma RPC estreita, não chama IA, não grava no banco e
# não integra o pipeline diário.
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: market-intelligence-label-lab
  cancel-in-progress: false

jobs:
  materializar:
    runs-on: [self-hosted, macOS, sempre-ligado]
    environment: market-intelligence-lab
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: ./.github/actions/python-mac

      - name: Limpar artefato anterior do runner persistente
        run: rm -f "$RUNNER_TEMP/radar-etiqueta-facts.json"

      - name: Conferir contrato sem rede
        run: "$PY coletor/teste_materializar_etiqueta_radar.py"

      - name: Materializar fatos candidatos sem publicar
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
        run: |
          set -euo pipefail
          "$PY" ferramentas/materializar_etiqueta_radar.py \
            --supabase \
            --saida "$RUNNER_TEMP/radar-etiqueta-facts.json"

      - name: Resumir cobertura e abstencao
        if: success()
        run: |
          "$PY" -c 'import json, os; p=json.load(open(os.environ["RUNNER_TEMP"]+"/radar-etiqueta-facts.json")); x=p["population"]; print("## Etiqueta privada\n\n- elegíveis: {}\n- com etiqueta-fonte: {}\n- com fato candidato: {}\n- abstidos globalmente: {}\n- pacote: `{}`\n\nNenhum conceito, evidência ou briefing foi publicado.".format(x["eligible_products"], x["products_with_source_label"], x["products_with_candidate_fact"], x["products_globally_abstained"], p["package_id"]))' >> "$GITHUB_STEP_SUMMARY"

      - name: Guardar pacote para revisão humana
        if: success()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: radar-etiqueta-facts-${{ github.run_id }}
          path: ${{ runner.temp }}/radar-etiqueta-facts.json
          if-no-files-found: error
          retention-days: 7

      - name: Remover artefato local do runner persistente
        if: always()
        run: rm -f "$RUNNER_TEMP/radar-etiqueta-facts.json"
