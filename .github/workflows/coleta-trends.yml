name: Coleta de busca (Google Trends)

# As sondas de 21/09/2026 validaram warmup, explore e multiline tanto no Linux
# quanto no macOS hospedados. Linux é o padrão barato; a recuperação manual
# pode escolher macOS para diversificar o egresso depois de uma recusa.
#
# A primeira execucao e o backfill de 5 anos (§19) e traz ~261 semanas por
# termo de uma vez. As seguintes sao incrementais e baratas.
on:
  workflow_call:
    inputs:
      modo:
        description: 'backfill, semanal ou vazio para escolha automatica'
        required: false
        type: string
        default: ''
      tentativa:
        description: 'rotacao do lote no mesmo dia (0 na coleta, 1 na recuperacao)'
        required: false
        type: number
        default: 0
      somente_reconsolidar:
        description: 'reparar diagnostico de saude sem consultar o Google'
        required: false
        type: boolean
        default: false
      data_operacional:
        description: 'Data ISO da coleta encadeada (vazio = hoje em Sao Paulo)'
        required: false
        type: string
        default: ''
      executor:
        description: 'Executor gerenciado (ubuntu-latest ou macos-latest)'
        required: false
        type: string
        default: 'ubuntu-latest'
    outputs:
      data_operacional:
        description: 'Data propagada para o portão de saúde'
        value: ${{ jobs.coletar.outputs.data_operacional }}
    secrets:
      SUPABASE_URL:
        required: true
      SUPABASE_SECRET_KEY:
        required: true
  workflow_dispatch:
    inputs:
      modo:
        description: 'backfill (so termos sem serie) ou semanal (todos)'
        required: false
        default: ''
      tentativa:
        description: 'rotacao do lote no mesmo dia'
        required: false
        type: number
        default: 0
      somente_reconsolidar:
        description: 'reparar diagnostico de saude sem consultar o Google'
        required: false
        type: boolean
        default: false
      data_operacional:
        description: 'Data ISO da coleta encadeada (vazio = hoje em Sao Paulo)'
        required: false
        default: ''
      executor:
        description: 'Executor gerenciado'
        required: false
        type: choice
        options:
          - ubuntu-latest
          - macos-latest
        default: ubuntu-latest

permissions:
  contents: read

concurrency:
  group: canario-dados
  cancel-in-progress: false

jobs:
  coletar:
    outputs:
      data_operacional: ${{ steps.ancora.outputs.data }}
    runs-on: ${{ inputs.executor || 'ubuntu-latest' }}
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: ./.github/actions/python-mac

      - name: Fixar data operacional da execução
        id: ancora
        env:
          DATA_SOLICITADA: ${{ inputs.data_operacional }}
        run: |
          data="${DATA_SOLICITADA:-$(TZ=America/Sao_Paulo date +%F)}"
          [[ "$data" =~ ^[0-9]{4}-[0-9]{2}-[0-9]{2}$ ]]
          echo "data=$data" >> "$GITHUB_OUTPUT"

      - name: Proteger capacidade do banco antes de escrever
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
        run: "$PY coletor/verificar_capacidade_banco.py"

      - name: Coletar Trends (geo BR, ancora fixa)
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
          # Vazio = o proprio coletor escolhe: backfill enquanto faltar termo
          # sem serie, semanal quando todos tiverem.
          TRENDS_MODO: ${{ inputs.modo }}
          # Uma recuperacao no mesmo dia consulta outro lote, em vez de
          # insistir nos grupos que acabaram de receber 429.
          TRENDS_TENTATIVA: ${{ inputs.tentativa }}
          # Operacao cirurgica: deriva `alertas.erro` das falhas ja gravadas.
          # Nao abre conexao com o Google nem repete um 429 conhecido.
          TRENDS_SOMENTE_RECONSOLIDAR: ${{ inputs.somente_reconsolidar }}
          DATA_OPERACIONAL: ${{ steps.ancora.outputs.data }}
        run: "$PY coletor/coletor_trends.py"
