name: Sonda do Actions (condicao 2.2)

# Diagnostico do IP de datacenter antes de agendar o coletor. Roda ao empurrar
# a propria sonda e sob demanda. NAO tem cron: nao coleta dado.
on:
  workflow_dispatch:
  push:
    paths:
      - 'coletor/sonda_actions.py'
      - 'coletor/teste_30s.py'
      - 'coletor/supabase_rest.py'
      - '.github/workflows/sonda.yml'

permissions:
  contents: read

concurrency:
  group: sonda
  cancel-in-progress: false

jobs:
  sondar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - uses: ./.github/actions/python-mac

      - name: Rodar a sonda
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
        run: "$PY coletor/sonda_actions.py"

      # A main protegida não aceita commit direto de workflow. O diagnóstico
      # é efêmero e não participa do produto, portanto fica como artefato da
      # própria execução em vez de abrir uma exceção de escrita.
      - name: Guardar o diagnóstico por quatorze dias
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: sonda-actions-${{ github.run_id }}-${{ github.run_attempt }}
          path: SONDA_ACTIONS.md
          if-no-files-found: error
          retention-days: 14
