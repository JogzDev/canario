name: Sonda do Actions (condicao 2.2)

# Diagnostico do IP de datacenter antes de agendar o coletor. Roda ao empurrar
# a propria sonda e sob demanda. NAO tem cron: nao coleta dado.
on:
  workflow_dispatch:
  push:
    paths:
      - 'coletor/sonda_actions.py'
      - 'coletor/teste_30s.py'
      - 'coletor/supabase_rest.py'
      - '.github/workflows/sonda.yml'

permissions:
  contents: write

concurrency:
  group: sonda
  cancel-in-progress: false

jobs:
  sondar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.11'

      - name: Rodar a sonda
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
        run: python3 coletor/sonda_actions.py

      # `always()`: se a sonda quebrar no meio, o diagnostico parcial ainda
      # tem valor e precisa chegar ao repositorio. Em branch de PR ela so
      # reporta o check: commit gerado mudaria o head depois do CI e apagaria
      # a associacao dos checks com o SHA revisado.
      - name: Commitar o resultado
        if: ${{ always() && github.ref_name == 'main' }}
        run: >-
          bash .github/commitar.sh "SONDA_ACTIONS.md" "Sonda do Actions - diagnostico"
