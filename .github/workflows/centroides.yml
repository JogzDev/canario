name: Visao da peca (§28) — treino e medicao

# Roda OBRIGATORIAMENTE no runner residencial, e nao por preferencia:
#
#   1. `VNGenerateImageFeaturePrintRequest` so existe em plataforma Apple. O
#      runner do GitHub e Linux.
#   2. Os CDNs de imagem devolvem 429 para faixa de datacenter. A regra 7 manda
#      respeitar isso, e nao procurar outro caminho.
#
# So `workflow_dispatch`: baixa milhares de imagens no ritmo de 1 req/s por
# dominio e leva horas. Nao entra no pipeline diario.

on:
  workflow_dispatch:
    inputs:
      tarefa:
        description: 'treinar_categoria (Create ML) ou centroides (Vision, referencia)'
        required: false
        default: 'treinar_categoria'
        type: choice
        options: [treinar_categoria, centroides]
      por_termo:
        description: 'Pecas por termo (400 ~ 1h)'
        required: false
        default: '400'

permissions:
  contents: write

concurrency:
  # Mesmo grupo das coletas: o i7 nao pode baixar imagem e catalogo ao mesmo
  # tempo sem estourar o ritmo por dominio da regra 7.
  group: canario-dados
  cancel-in-progress: false

jobs:
  gerar:
    # Fixo no self-hosted, e nao `vars.RUNNER_COLETA || ubuntu-latest`: se cair
    # no datacenter este job nao falha, ele PRODUZ NUMERO ERRADO -- Vision
    # ausente vira zero vetor, e 429 em massa vira centroide de meia duzia de
    # imagens. Melhor nao existir runner do que existir o errado.
    runs-on: [self-hosted, macOS]
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Conferir que ha Swift e Vision
        run: |
          swift --version
          echo 'import Vision; print("Vision ok")' > /tmp/vcheck.swift
          swift /tmp/vcheck.swift

      - name: Treinar e medir contra o portao da §28
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
          TAREFA: ${{ inputs.tarefa }}
          POR_TERMO: ${{ inputs.por_termo }}
        run: |
          case "$TAREFA" in
            treinar_categoria|centroides) ;;
            *) echo "tarefa desconhecida: $TAREFA"; exit 1 ;;
          esac
          swift "ferramentas/$TAREFA.swift" --por-termo "$POR_TERMO"

      - name: Resumo na aba do Actions
        if: always()
        run: |
          {
            echo "## Visao da peca (§28) — ${{ inputs.tarefa }}"
            echo ''
            echo 'O numero da concordancia esta no log do passo anterior.'
            echo 'O portao abre so com >= 80%; abaixo disso nada e escrito e o'
            echo 'app segue sem sugestao — por desenho, nao por falha.'
            echo ''
            echo '### Artefatos'
            echo '```'
            ls -la app/Canario/Recursos/ 2>/dev/null || echo '(nenhum: ficou abaixo do piso)'
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Commitar o artefato
        run: >-
          bash .github/commitar.sh
          "app/Canario/Recursos"
          "Visao da peca: artefato que passou no portao da §28"
