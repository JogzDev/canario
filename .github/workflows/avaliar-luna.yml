name: OpenAI — avaliar Luna nas pecas

# Experimento manual e com custo. Usa somente imagens publicas de produto que
# ja estao no cache do i7; nenhuma foto de usuario passa por este workflow.
# O rotulo de categoria veio do titulo do catalogo e e diagnostico: o portao de
# 80% da A15 so abre depois de revisao humana de categoria e cor.

on:
  workflow_dispatch:
    inputs:
      quantidade:
        description: 'Tamanho da amostra estratificada (24 = smoke; 300 = benchmark)'
        required: true
        default: '24'
        type: choice
        options: ['24', '300']

permissions:
  contents: read

concurrency:
  # Evita disputar o i7 com coleta/treino e alterar a latencia medida.
  group: canario-dados
  cancel-in-progress: false

jobs:
  avaliar:
    # Exige Xcode: o segmentador usa VNGenerateForegroundInstanceMaskRequest,
    # que o SDK do i7 nao tem. O rotulo `xcode` aponta para o Mac do JP.
    runs-on: [self-hosted, macOS, xcode]
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Avaliar amostra sem expor a chave
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          QUANTIDADE: ${{ inputs.quantidade }}
        run: |
          set -euo pipefail
          xcrun swiftc ferramentas/segmentar_fundo.swift \
            -framework Vision -framework CoreImage -framework ImageIO \
            -framework UniformTypeIdentifiers \
            -o "$RUNNER_TEMP/segmentar-fundo"
          # 300 imagens levam dezenas de minutos; manter o MacBook acordado
          # evita perder respostas pagas no meio do benchmark.
          caffeinate -dimsu python3 ferramentas/avaliar_luna.py \
            --quantidade "$QUANTIDADE" \
            --segmentador "$RUNNER_TEMP/segmentar-fundo" \
            --saida "$RUNNER_TEMP/avaliacao-luna.jsonl" \
            --resumo "$RUNNER_TEMP/avaliacao-luna.md"

      - name: Publicar resumo sem imagens nem chave
        if: always()
        run: |
          if [[ -f "$RUNNER_TEMP/avaliacao-luna.md" ]]; then
            cat "$RUNNER_TEMP/avaliacao-luna.md" >> "$GITHUB_STEP_SUMMARY"
          else
            echo '## Luna — avaliacao nao concluida' >> "$GITHUB_STEP_SUMMARY"
            echo 'Consulte o log do passo anterior.' >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Guardar respostas completas para auditoria
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: luna-respostas-${{ inputs.quantidade }}-run-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/avaliacao-luna.jsonl
            ${{ runner.temp }}/avaliacao-luna.md
          if-no-files-found: warn
          retention-days: 3
