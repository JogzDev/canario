name: Coleta editorial (share of voice)

# O FFW foi validado no Linux gerenciado em 21/09/2026. Business of Fashion
# não disponibilizou robots.txt ao executor (403) e fica como ausência
# declarada, nunca como feed contornado ou contado como cobertura.
on:
  workflow_call:
    inputs:
      somente_arquivo:
        description: 'Arquivar feeds sem publicar a serie intermediaria'
        required: false
        type: boolean
        default: false
      data_operacional:
        description: 'Data ISO comum ao pipeline (vazio = hoje em Sao Paulo)'
        required: false
        type: string
        default: ''
    outputs:
      data_operacional:
        description: 'Data propagada para a próxima perna'
        value: ${{ jobs.coletar.outputs.data_operacional }}
    secrets:
      SUPABASE_URL:
        required: true
      SUPABASE_SECRET_KEY:
        required: true
  workflow_dispatch:
    inputs:
      somente_arquivo:
        description: 'Arquivar feeds sem publicar a serie intermediaria'
        required: false
        type: boolean
        default: false
      data_operacional:
        description: 'Data ISO comum ao pipeline (vazio = hoje em Sao Paulo)'
        required: false
        default: ''

permissions:
  contents: read

concurrency:
  group: canario-dados
  cancel-in-progress: false

jobs:
  coletar:
    outputs:
      data_operacional: ${{ steps.ancora.outputs.data }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - uses: ./.github/actions/python-mac

      - name: Fixar data operacional da execução
        id: ancora
        env:
          DATA_SOLICITADA: ${{ inputs.data_operacional }}
        run: |
          data="${DATA_SOLICITADA:-$(TZ=America/Sao_Paulo date +%F)}"
          [[ "$data" =~ ^[0-9]{4}-[0-9]{2}-[0-9]{2}$ ]]
          echo "data=$data" >> "$GITHUB_OUTPUT"

      - name: Proteger capacidade do banco antes de escrever
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
        run: "$PY coletor/verificar_capacidade_banco.py"

      - name: Coletar editorial e casar contra a taxonomia
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
          EDITORIAL_SOMENTE_ARQUIVO: ${{ inputs.somente_arquivo && '1' || '0' }}
          DATA_OPERACIONAL: ${{ steps.ancora.outputs.data }}
        run: "$PY coletor/coletor_editorial.py"
