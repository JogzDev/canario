name: Coleta editorial (share of voice)

# Roda no datacenter do GitHub: feed de veiculo editorial nao tem o problema de
# rate-limit por IP que a VTEX e o Google tem. So a coleta de busca e as duas
# Shopify precisam do runner residencial.
on:
  workflow_call:
    secrets:
      SUPABASE_URL:
        required: true
      SUPABASE_SECRET_KEY:
        required: true
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: canario-dados
  cancel-in-progress: false

jobs:
  coletar:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Coletar editorial e casar contra a taxonomia
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
        run: python3 coletor/coletor_editorial.py
