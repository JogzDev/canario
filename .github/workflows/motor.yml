name: Motor (atributos, eventos, indice)

# Roda no datacenter: e computacao sobre dado que ja esta no Supabase, sem
# tocar em site nenhum. Nao sofre rate-limit e nao precisa do runner do Mac.
on:
  workflow_call:
    inputs:
      backfill_editorial:
        description: 'Refazer o backfill editorial de 5 anos'
        required: false
        type: boolean
        default: false
    secrets:
      SUPABASE_URL:
        required: true
      SUPABASE_SECRET_KEY:
        required: true
  workflow_dispatch:
    inputs:
      backfill_editorial:
        description: 'Refazer o backfill editorial de 5 anos (demorado)'
        type: boolean
        required: false
        default: false

permissions:
  contents: read

concurrency:
  group: canario-dados
  cancel-in-progress: false

jobs:
  computar:
    runs-on: [self-hosted, macOS, sempre-ligado]
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - uses: ./.github/actions/python-mac

      # OPT-IN, e nao "todo disparo manual".
      #
      # Era `github.event_name == 'workflow_dispatch'`, o que tornava impossivel
      # testar o motor a mao sem varrer 5 anos de arquivo de 6 veiculos. Em
      # 01/08 isso custou 25 minutos para descobrir se um `statement_timeout`
      # tinha sido corrigido -- e o passo que interessava era o ultimo.
      - name: Backfill editorial (coorte fixa, 5 anos)
        if: inputs.backfill_editorial
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
        run: "$PY coletor/backfill_editorial.py"

      # Fica por ultimo inclusive no modo backfill: o script prepara o stage,
      # agenda a transacao dentro do Postgres e acompanha ate o COMMIT.
      - name: Preparar atributos e publicar todo o motor atomicamente
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
        run: "$PY coletor/motor_atributos.py"
