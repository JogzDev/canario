name: Motor (atributos, eventos, indice)

# Roda no datacenter: e computacao sobre dado que ja esta no Supabase, sem
# tocar em site nenhum. Nao sofre rate-limit e nao precisa do runner do Mac.
on:
  workflow_dispatch:
    inputs:
      backfill_editorial:
        description: 'Refazer o backfill editorial de 5 anos (demorado)'
        type: boolean
        required: false
        default: false
  schedule:
    # 04:10 BRT = 07:10 UTC, depois de todas as coletas (varejo 03:00,
    # shopify 03:20, editorial 03:40). Servidor calcula, app consulta (§33).
    - cron: '10 7 * * *'

permissions:
  contents: write

concurrency:
  group: motor
  cancel-in-progress: false

jobs:
  computar:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Ligar produtos aos termos da taxonomia
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
        run: python3 coletor/motor_atributos.py

      # OPT-IN, e nao "todo disparo manual".
      #
      # Era `github.event_name == 'workflow_dispatch'`, o que tornava impossivel
      # testar o motor a mao sem varrer 5 anos de arquivo de 6 veiculos. Em
      # 01/08 isso custou 25 minutos para descobrir se um `statement_timeout`
      # tinha sido corrigido -- e o passo que interessava era o ultimo.
      - name: Backfill editorial (coorte fixa, 5 anos)
        if: inputs.backfill_editorial
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
        run: python3 coletor/backfill_editorial.py

      - name: Computar séries, z-score, índice e estados
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
        run: python3 coletor/motor_computar.py
