name: Motor (atributos, eventos, indice)

# Roda no datacenter: e computacao sobre dado que ja esta no Supabase, sem
# tocar em site nenhum. Nao sofre rate-limit e nao precisa do runner do Mac.
on:
  workflow_call:
    inputs:
      backfill_editorial:
        description: 'Refazer o backfill editorial de 5 anos'
        required: false
        type: boolean
        default: false
    secrets:
      SUPABASE_URL:
        required: true
      SUPABASE_SECRET_KEY:
        required: true
  workflow_dispatch:
    inputs:
      backfill_editorial:
        description: 'Refazer o backfill editorial de 5 anos (demorado)'
        type: boolean
        required: false
        default: false

permissions:
  contents: read

concurrency:
  group: canario-dados
  cancel-in-progress: false

jobs:
  computar:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.11'

      # OPT-IN, e nao "todo disparo manual".
      #
      # Era `github.event_name == 'workflow_dispatch'`, o que tornava impossivel
      # testar o motor a mao sem varrer 5 anos de arquivo de 6 veiculos. Em
      # 01/08 isso custou 25 minutos para descobrir se um `statement_timeout`
      # tinha sido corrigido -- e o passo que interessava era o ultimo.
      - name: Backfill editorial (coorte fixa, 5 anos)
        if: inputs.backfill_editorial
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
        run: python3 coletor/backfill_editorial.py

      # Fica por ultimo inclusive no modo backfill: a mesma transacao publica
      # atributos e recalcula todas as leituras já com o editorial atualizado.
      - name: Preparar atributos e publicar todo o motor atomicamente
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
        run: python3 coletor/motor_atributos.py
