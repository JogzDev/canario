name: OpenAI — validar chave sem inferencia

# A primeira validação não manda prompt nem imagem. `GET /v1/models` só
# autentica a chave e lista os modelos disponíveis para o projeto da OpenAI.
# Portanto não há tokens de entrada/saída nem consumo de crédito de inferência.

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - .github/workflows/validar-openai.yml

permissions:
  contents: read

jobs:
  validar:
    # Regra do projeto: nada roda na máquina pessoal. O i7 já é o runner de
    # visão e tem a rede/ambiente em que o benchmark seguinte será executado.
    runs-on: [self-hosted, macOS, X64]
    timeout-minutes: 5

    steps:
      - name: Validar secret e acesso ao Luna sem inferencia
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        shell: bash
        run: |
          set -euo pipefail

          if [[ -z "${OPENAI_API_KEY:-}" ]]; then
            echo "OPENAI_API_KEY não foi injetado no workflow."
            exit 1
          fi

          resposta="$RUNNER_TEMP/openai-models.json"
          trap 'rm -f "$resposta"' EXIT

          codigo="$(curl --silent --show-error \
            --output "$resposta" --write-out '%{http_code}' \
            https://api.openai.com/v1/models \
            --header "Authorization: Bearer $OPENAI_API_KEY")"

          if [[ "$codigo" != "200" ]]; then
            echo "A OpenAI recusou a validação (HTTP $codigo)."
            echo "A resposta não será impressa para não expor detalhes da conta."
            exit 1
          fi

          python3 - "$resposta" <<'PY'
          import json
          import sys

          with open(sys.argv[1], encoding="utf-8") as arquivo:
              modelos = {item.get("id") for item in json.load(arquivo).get("data", [])}

          esperado = "gpt-5.6-luna"
          if esperado not in modelos:
              raise SystemExit(f"Chave válida, mas {esperado} não apareceu para este projeto.")

          print("OPENAI_API_KEY foi injetado sem ser exibido.")
          print("GET /v1/models retornou 200.")
          print(f"{esperado} está disponível para o projeto.")
          print("Nenhum endpoint de inferência foi chamado; tokens consumidos: 0.")
          PY
