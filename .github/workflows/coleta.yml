name: Coleta de varejo + saude

# Runner: definido pela variavel de repositorio RUNNER_COLETA.
#   - nao definida  -> ubuntu-latest (datacenter do GitHub; a VTEX responde 429)
#   - "self-hosted" -> o Mac do JP, em IP residencial (que a VTEX aceita)
# Trocar de um para o outro e so mudar a variavel em Settings > Variables.
on:
  workflow_call:
    inputs:
      marca:
        description: 'Coletar so uma marca (vazio = todas)'
        required: false
        type: string
        default: ''
      segmento:
        description: 'Segmento isolado a coletar'
        required: false
        type: string
        default: 'feminino_casual_br'
      pente_fino:
        description: 'Rodar sonda ampla quando marca estiver vazia'
        required: false
        type: boolean
        default: true
    secrets:
      SUPABASE_URL:
        required: true
      SUPABASE_SECRET_KEY:
        required: true
  workflow_dispatch:
    inputs:
      marca:
        description: 'Coletar so uma marca (particionamento; vazio = todas)'
        required: false
        default: ''
      segmento:
        description: 'Segmento isolado a coletar'
        required: false
        default: 'feminino_casual_br'
      pente_fino:
        description: 'Rodar sonda ampla quando marca estiver vazia'
        required: false
        type: boolean
        default: true

permissions:
  contents: write

concurrency:
  # Serializa também disparos manuais contra as demais pernas. O pipeline
  # diário chama uma por vez, mas um clique manual não pode entrar no meio.
  group: canario-dados
  cancel-in-progress: false

jobs:
  coletar:
    runs-on: ${{ vars.RUNNER_COLETA || 'ubuntu-latest' }}
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      # O comentario antigo dizia que o Python 3.9 do macOS serviria de reserva.
      # Nao serve: no i7 o `python3` e um atalho que exige as Command Line Tools
      # do Xcode, que a maquina nao tem. A acao abaixo resolve os dois runners.
      - uses: ./.github/actions/python-mac

      - name: Proteger capacidade do banco antes de escrever
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
        run: "$PY coletor/verificar_capacidade_banco.py"

      - name: Pente fino do datacenter
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.marca == '' && inputs.pente_fino }}
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
        run: "$PY coletor/pente_fino_datacenter.py"

      - name: Commitar veredito do pente fino
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.marca == '' && inputs.pente_fino }}
        run: >-
          bash .github/commitar.sh
          "PENTE_FINO_DATACENTER.md anexos/painel_marcas.csv"
          "Pente fino do datacenter"

      - name: Coletar varejo e gerar saude
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
          COLETA_MARCA: ${{ inputs.marca }}
          COLETA_SEGMENTO: ${{ inputs.segmento }}
          # Divisao de trabalho por plataforma: as Shopify (Amaro, PatBo) dao
          # 429 daqui e ficam com o runner residencial (coleta-shopify.yml).
          COLETA_PLATAFORMA: vtex
        run: "$PY coletor/coletor_varejo.py"

      # Um único job ao fim do pipeline publica SAUDE.md. Aqui persiste apenas
      # a árvore VTEX descoberta, que tem um único escritor.
      - name: Commitar cache de departamentos
        if: always()
        run: >-
          bash .github/commitar.sh
          "anexos/departamentos_vtex.json"
          "Cache de departamentos da coleta"
