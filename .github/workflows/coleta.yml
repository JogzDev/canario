name: Coleta de varejo + saude

# Executa no Linux gerenciado. A sonda de 21/09/2026 validou VTEX, Shopify e
# FFW nesse egresso. A Animale fica semanal porque seu fallback visita mais de
# cinco mil páginas; isso controla minutos sem usar computador pessoal.
on:
  workflow_call:
    inputs:
      marca:
        description: 'Coletar so uma marca (vazio = todas)'
        required: false
        type: string
        default: ''
      segmento:
        description: 'Segmento isolado a coletar'
        required: false
        type: string
        default: 'feminino_casual_br'
      pente_fino:
        description: 'Rodar sonda ampla quando marca estiver vazia'
        required: false
        type: boolean
        default: true
      data_operacional:
        description: 'Data ISO comum ao pipeline (vazio = hoje em Sao Paulo)'
        required: false
        type: string
        default: ''
      animale_forcar:
        description: 'Forçar a varredura da Animale fora da segunda-feira'
        required: false
        type: boolean
        default: false
    outputs:
      data_operacional:
        description: 'Data fixada para as pernas seguintes'
        value: ${{ jobs.coletar.outputs.data_operacional }}
    secrets:
      SUPABASE_URL:
        required: true
      SUPABASE_SECRET_KEY:
        required: true
  workflow_dispatch:
    inputs:
      marca:
        description: 'Coletar so uma marca (particionamento; vazio = todas)'
        required: false
        default: ''
      segmento:
        description: 'Segmento isolado a coletar'
        required: false
        default: 'feminino_casual_br'
      pente_fino:
        description: 'Rodar sonda ampla quando marca estiver vazia'
        required: false
        type: boolean
        default: true
      data_operacional:
        description: 'Data ISO comum ao pipeline (vazio = hoje em Sao Paulo)'
        required: false
        default: ''
      animale_forcar:
        description: 'Forçar a varredura da Animale fora da segunda-feira'
        required: false
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  # Serializa também disparos manuais contra as demais pernas. O pipeline
  # diário chama uma por vez, mas um clique manual não pode entrar no meio.
  group: canario-dados
  cancel-in-progress: false

jobs:
  coletar:
    outputs:
      data_operacional: ${{ steps.ancora.outputs.data }}
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      # O comentario antigo dizia que o Python 3.9 do macOS serviria de reserva.
      # Nao serve: no i7 o `python3` e um atalho que exige as Command Line Tools
      # do Xcode, que a maquina nao tem. A acao abaixo resolve os dois runners.
      - uses: ./.github/actions/python-mac

      - name: Fixar data operacional da execução
        id: ancora
        env:
          DATA_SOLICITADA: ${{ inputs.data_operacional }}
        run: |
          data="${DATA_SOLICITADA:-$(TZ=America/Sao_Paulo date +%F)}"
          [[ "$data" =~ ^[0-9]{4}-[0-9]{2}-[0-9]{2}$ ]]
          echo "data=$data" >> "$GITHUB_OUTPUT"

      - name: Proteger capacidade do banco antes de escrever
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
        run: "$PY coletor/verificar_capacidade_banco.py"

      - name: Pente fino do datacenter
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.marca == '' && inputs.pente_fino }}
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
        run: "$PY coletor/pente_fino_datacenter.py"

      - name: Expor veredito do pente fino
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.marca == '' && inputs.pente_fino }}
        continue-on-error: true
        run: cat PENTE_FINO_DATACENTER.md >> "$GITHUB_STEP_SUMMARY"

      - name: Guardar veredito do pente fino
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.marca == '' && inputs.pente_fino }}
        continue-on-error: true
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: pente-fino-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            PENTE_FINO_DATACENTER.md
            anexos/painel_marcas.csv
          if-no-files-found: warn
          retention-days: 30

      - name: Coletar varejo e gerar saude
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
          COLETA_MARCA: ${{ inputs.marca }}
          COLETA_SEGMENTO: ${{ inputs.segmento }}
          DATA_OPERACIONAL: ${{ steps.ancora.outputs.data }}
          # Divisao por plataforma preserva métricas e recuperação separadas.
          COLETA_PLATAFORMA: vtex
          # O fallback da Animale percorre 5.104 paginas e fica desligado ate
          # a observacao de capacidade autorizar seu custo. A variavel do
          # repositorio deve ser exatamente "1" para o rollout.
          COLETA_ANIMALE_PUBLICA: ${{ vars.COLETA_ANIMALE_PUBLICA || '0' }}
          COLETA_ANIMALE_CADENCIA: semanal
          COLETA_ANIMALE_FORCAR: ${{ inputs.animale_forcar && '1' || '0' }}
        run: "$PY coletor/coletor_varejo.py"

      # A main protegida exige PR. Cache e coleta sao responsabilidades
      # diferentes: uma descoberta nova fica auditavel como artefato, sem
      # transformar a coleta em vermelha por uma tentativa de push proibida.
      - name: Detectar mudanca no cache de departamentos
        id: cache
        if: always()
        continue-on-error: true
        run: |
          if git diff --quiet -- anexos/departamentos_vtex.json; then
            echo 'alterado=false' >> "$GITHUB_OUTPUT"
          else
            echo 'alterado=true' >> "$GITHUB_OUTPUT"
            {
              echo '## Cache VTEX atualizado'
              echo ''
              echo 'A coleta descobriu departamentos novos. O arquivo está no artefato desta execução e deve entrar por PR.'
            } >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Guardar cache de departamentos atualizado
        if: ${{ always() && steps.cache.outputs.alterado == 'true' }}
        continue-on-error: true
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: departamentos-vtex-${{ github.run_id }}-${{ github.run_attempt }}
          path: anexos/departamentos_vtex.json
          if-no-files-found: warn
          retention-days: 30
