name: Coleta de varejo + saude

# Runner: definido pela variavel de repositorio RUNNER_COLETA.
#   - nao definida  -> ubuntu-latest (datacenter do GitHub; a VTEX responde 429)
#   - "self-hosted" -> o Mac do JP, em IP residencial (que a VTEX aceita)
# Trocar de um para o outro e so mudar a variavel em Settings > Variables.
on:
  workflow_dispatch:
    inputs:
      marca:
        description: 'Coletar so uma marca (particionamento; vazio = todas)'
        required: false
        default: ''
  schedule:
    # 03:00 BRT = 06:00 UTC (Brasil sem horario de verao desde 2019).
    # So faz efeito quando o runner residencial estiver de pe: no datacenter
    # a VTEX devolve 429 e o disjuntor aborta.
    - cron: '0 6 * * *'

permissions:
  contents: write

concurrency:
  group: coleta
  cancel-in-progress: false

jobs:
  coletar:
    runs-on: ${{ vars.RUNNER_COLETA || 'ubuntu-latest' }}
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4

      # No Mac self-hosted isso pode falhar (toolcache ausente); nao e bloqueador:
      # os coletores rodam tambem no Python 3.9 que vem com o macOS.
      - uses: actions/setup-python@v5
        continue-on-error: true
        with:
          python-version: '3.11'

      - name: Pente fino do datacenter
        if: github.event_name == 'workflow_dispatch'
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
        run: python3 coletor/pente_fino_datacenter.py

      - name: Commitar veredito do pente fino
        if: github.event_name == 'workflow_dispatch'
        run: bash .github/commitar.sh "PENTE_FINO_DATACENTER.md anexos/painel_marcas.csv" "Pente fino: veredito dos casos-limite"

      - name: Coletar varejo e gerar saude
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
          COLETA_MARCA: ${{ github.event.inputs.marca }}
        run: python3 coletor/coletor_varejo.py

      - name: Commitar SAUDE.md
        if: always()
        run: bash .github/commitar.sh "SAUDE.md" "Saúde: relatório da coleta"
