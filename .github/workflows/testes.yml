name: Testes

# Roda a cada push e em cada PR. Existe porque suite que so roda quando alguem
# lembra e suite que falha em silencio -- e o projeto ja teve tres bugs que os
# testes teriam pego se estivessem rodando sozinhos.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  segredos:
    name: Segredos no historico e na arvore (Gitleaks)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      # O historico inteiro e parte do contrato: um segredo removido do HEAD
      # continua recuperavel em commits antigos.
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
      - name: Baixar Gitleaks fixado e conferir integridade
        env:
          GITLEAKS_VERSION: 8.30.1
          GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
        run: |
          set -euo pipefail
          arquivo="$RUNNER_TEMP/gitleaks.tar.gz"
          url="https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl --fail --silent --show-error --location "$url" --output "$arquivo"
          printf '%s  %s\n' "$GITLEAKS_SHA256" "$arquivo" | sha256sum --check --strict
          tar --extract --gzip --file "$arquivo" --directory "$RUNNER_TEMP" gitleaks
          "$RUNNER_TEMP/gitleaks" version | grep --fixed-strings "$GITLEAKS_VERSION"
      - name: Nenhum segredo no historico ou na arvore atual
        run: |
          set -euo pipefail
          scanner="$RUNNER_TEMP/gitleaks"
          "$scanner" git --redact=100 --no-banner --no-color --timeout=300 \
            --log-opts="--full-history --all --diff-filter=tuxdb" .
          "$scanner" dir --redact=100 --no-banner --no-color --timeout=300 .

  coletores:
    name: Coletores (Python)
    # Lógica Python não depende de macOS nem de computador pessoal.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: ./.github/actions/python-mac
      - name: Instalar pyyaml (usado pelo teste de workflows)
        run: "$PY -m pip install --quiet pyyaml"
      - name: Matcher compartilhado
        run: "$PY coletor/teste_matcher.py"
      - name: Contexto de moda no editorial
        run: "$PY coletor/teste_contexto_editorial.py"
      - name: Filtro de gênero do editorial
        run: "$PY coletor/teste_filtro_genero_editorial.py"
      - name: Classificador de categorias
        run: "$PY coletor/teste_classificador.py"
      - name: Lista negra de vocabulario (§6)
        run: "$PY coletor/teste_vocabulario.py"
      - name: Normalizador de tamanhos (§24)
        run: "$PY coletor/teste_tamanhos.py"
      - name: Filtro de populacao (nome da marca, acessorio)
        run: "$PY coletor/teste_populacao.py"
      - name: Materializacao nao apaga estado medido
        run: "$PY coletor/teste_materializacao.py"
      - name: Estado final das migrations
        run: "$PY coletor/teste_migrations.py"
      - name: Publicacao atomica do motor
        run: "$PY coletor/teste_publicacao_motor.py"
      - name: Portao operacional de saude
        run: "$PY coletor/teste_saude.py"
      - name: Portao de capacidade do banco
        run: "$PY coletor/teste_capacidade_banco.py"
      - name: Isolamento dos paineis por segmento
        run: "$PY coletor/teste_isolamento_segmento.py"
      - name: Paginacao VTEX sem perda por empate de preco
        run: "$PY coletor/teste_paginacao_vtex.py"
      - name: Presenca e oferta observadas no varejo
        run: "$PY coletor/teste_oferta_varejo.py"
      - name: Fallback publico da Animale por sitemap
        run: "$PY coletor/teste_animale_sitemap.py"
      - name: Nuvemshop por sitemap e paginas publicas
        run: "$PY coletor/teste_nuvemshop.py"
      - name: Benchmark de foto le o contrato do app
        run: "$PY ferramentas/benchmark_foto/teste_contrato.py"
      - name: Leitura especifica recusa frase sem prova
        run: npx -y deno@2.9.6 test supabase/functions/ler-peca/leitura_test.ts
      - name: Planejamento diario do Google Trends
        run: "$PY coletor/teste_trends.py"
      - name: Fila da perna de busca (§19)
        run: "$PY coletor/teste_fila_de_busca.py"
      # O deslocamento de seis dias entre busca e editorial nao levantava
      # excecao e nao quebrava teste: o numero existia e parecia razoavel, so
      # media outro periodo. Este confere que as duas pernas usam o mesmo
      # calendario, comparando com a funcao real do coletor editorial.
      - name: Busca e editorial na mesma semana (§22)
        run: "$PY coletor/teste_semana_da_busca.py"
      - name: Workflows do Actions
        run: "$PY coletor/teste_workflows.py"
      - name: Sonda de executor gerenciado
        run: "$PY coletor/teste_sonda_origem_gerenciada.py"
      - name: Contrato do Xcode Cloud
        run: "$PY coletor/teste_xcode_cloud.py"
      - name: Runner residencial não duplica agendas
        run: "$PY coletor/teste_runner_residencial.py"
      # Bundle, time e versao ja divergiram duas vezes sem ninguem ver, e nas
      # duas o sintoma so apareceu na hora de assinar para a loja.
      - name: Identidade do app e uma so
        run: "$PY coletor/teste_identidade_do_app.py"
      # A44 sincronizou miniatura e dois documentos publicos ficaram dizendo o
      # contrario -- inclusive a etiqueta de privacidade enviada a Apple. Este
      # confere codigo, manifesto, ficha, politica e exclusao de conta juntos.
      - name: Privacidade declarada bate com o binario
        run: "$PY coletor/teste_privacidade_declarada.py"
      - name: Contratos de seguranca e cadeia de dependencias
        run: "$PY coletor/teste_seguranca.py"
      - name: Regressões da experiência em aparelho
        run: "$PY coletor/teste_experiencia_app.py"
      # Icone faltando nao quebra nada: o termo aparece com um circulo
      # pontilhado e segue selecionavel. Este portao e o unico jeito de a
      # falta aparecer antes de alguem abrir a tela.
      - name: Todo termo da taxonomia tem icone
        run: "$PY coletor/teste_icones_da_taxonomia.py"
      # Cor nao quebra teste: um #0A0B1A que vira #0E1116 compila, roda e so
      # aparece quando o desenho volta do Figma e nao bate.
      - name: A paleta oficial esta no codigo
        run: "$PY coletor/teste_paleta.py"
      - name: Contrato do avaliador Luna (sem rede)
        run: "$PY coletor/teste_avaliar_luna.py"
      - name: Contrato da Edge Function Luna (sem rede)
        run: "$PY coletor/teste_edge_luna.py"
      # O contrato acima le o arquivo do disco. Em 14/08 o arquivo estava
      # integro e a funcao publicada nao subia -- este confere a sonda que
      # pergunta ao servidor, que e a unica que separa os dois casos.
      - name: Classificacao da sonda da rota paga (sem rede)
        run: "$PY coletor/teste_sonda_edge_luna.py"
      - name: Contrato da sonda pública A57/A58 (sem rede)
        run: "$PY coletor/teste_sonda_significado_publico.py"
      - name: Publicação do painel não passa só pelo motor (sem rede)
        run: "$PY coletor/teste_publicacao_painel.py"
      # Alarme que dispara todo dia deixa de ser lido: este confere que o
      # alerta agrupa noites seguidas numa issue so e fecha sozinho no verde.
      - name: Alerta do pipeline nao vira ruido (sem rede)
        run: "$PY coletor/teste_alertar.py"
      - name: Pacote cego de revisao Luna (sem rede)
        run: "$PY coletor/teste_preparar_revisao_luna.py"
      - name: Consolidacao humana do Luna (sem rede)
        run: "$PY coletor/teste_consolidar_revisao_luna.py"
      - name: Adjudicacao cega do Luna (sem rede)
        run: "$PY coletor/teste_preparar_adjudicacao_luna.py"
      # A troca de idioma da A53 falha CALADA: uma frase fora do catalogo nao
      # quebra o build, nao aparece no log e nao derruba teste nenhum -- ela so
      # chega ao usuario em ingles no meio do portugues. Aconteceu com
      # "Language" e "Ask me the first time", vistas no simulador em 05/09.
      # Este portao le o codigo e o catalogo e exige que os dois concordem.
      - name: Toda frase da interface esta traduzida (A53)
        run: "$PY ferramentas/extrair_frases.py --conferir"
      # O portao acima confere que a CHAVE existe e tem pt-BR. Ele nao ve a
      # frase que a tela monta -- e foi por ai que passaram "2nd restock for
      # size G in 2 dias", o "above" no meio de uma explicacao em portugues e a
      # tela de Perguntas inteira em ingles, com o outro portao verde. Este aqui
      # procura prosa que nao chega a traducao nenhuma.
      - name: Nenhuma prosa de tela fora da traducao (A53)
        run: "$PY ferramentas/frases_compostas.py --conferir"
      - name: Modulos compilam
        run: "$PY -m py_compile coletor/*.py"
      # `py_compile` acima confere SINTAXE. Nome usado e nunca definido passa
      # limpo por ele e so estoura em execucao -- foi assim que `ja_tem` chegou
      # ao runner em 05/08 e derrubou a coleta de busca depois de meia hora de
      # trabalho ja feito.
      - name: Nome usado e nunca definido
        run: "$PY coletor/teste_nomes.py"

  dependencias-swift:
    name: Dependencias Swift e lockfiles (OSV)
    # O repositorio privado pessoal nao tem GitHub Code Security habilitado.
    # O OSV cobre o Package.resolved e os lockfiles npm sem depender desse
    # produto pago; SARIF fica desligado, mas qualquer vulnerabilidade falha.
    uses: google/osv-scanner-action/.github/workflows/osv-scanner-reusable.yml@a345acffa64b0eaede81a3d9aae6141214d9c8fc # v2.6.0
    with:
      scan-args: |-
        --recursive
        ./
      upload-sarif: false
      fail-on-vuln: true

  dependencias-deno:
    name: Edge Functions (Deno)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: denoland/setup-deno@22d081ff2d3a40755e97629de92e3bcbfa7cf2ed # v2.0.5
        with:
          deno-version: v2.9.7
      - name: Lockfile reproduzivel, tipos e vulnerabilidades
        working-directory: supabase/functions
        run: |
          deno install --entrypoint analisar-peca/index.ts excluir-conta/index.ts registrar-credencial-apple/index.ts --lock deno.lock --lockfile-only --frozen-lockfile --no-config
          deno check --lock deno.lock --frozen-lockfile --no-config analisar-peca/index.ts excluir-conta/index.ts registrar-credencial-apple/index.ts
          deno audit --lock deno.lock --frozen-lockfile

  capacidade:
    name: Laboratorio de capacidade (PostgreSQL 17 descartavel)
    # O pacote baixa o PostgreSQL 17 para o próprio runner Linux descartável.
    #
    # `coletor/teste_migrations.py` le as migrations como texto. Este job as
    # executa: prova que o "antes" e o codigo de producao (hash), que ele
    # reescreve tudo, e que P21/P22/P24/P25 corrigem sem mudar o resultado. E
    # ensaia cada passo do roteiro da etapa 1 pelo mesmo executor que rodaria
    # em producao.
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      # Fora do workspace: `actions/checkout` limpa o diretorio a cada
      # execucao. Com o lockfile igual, `npm install` nao baixa nada.
      - name: Binarios do PostgreSQL embutido (uma vez por maquina)
        run: |
          set -euo pipefail
          LAB="$HOME/.canario/laboratorio-capacidade"
          mkdir -p "$LAB"
          cp ferramentas/laboratorio_capacidade/package.json "$LAB/"
          cp ferramentas/laboratorio_capacidade/package-lock.json "$LAB/"
          cd "$LAB" && npm install --no-audit --no-fund

      - name: P21, P22, P24 e P25 num banco de verdade
        run: node ferramentas/laboratorio_capacidade/rodar.mjs

      - name: Ensaio do roteiro da etapa 1
        run: node ferramentas/capacidade/teste_roteiro.mjs

  banco:
    name: Laboratorio SQL (PostgreSQL 17 descartavel)
    # Também roda em Linux descartável; nenhum laboratório depende do Mac.
    #
    # `coletor/teste_migrations.py` (no job de cima) le as migrations como
    # TEXTO: pega contrato apagado, nao pega `join` errado nem denominador
    # tirado da data errada. Este job executa P24, A57 e A58 na ordem real,
    # confere o portao 87 e roda os dados desenhados para que cada defeito
    # conhecido apareca como falha.
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      # Fora do workspace de proposito: `actions/checkout` limpa o diretorio a
      # cada execucao, e reinstalar 133 MB por push seria desperdicio. Com o
      # lockfile igual, `npm install` nao baixa nada.
      - name: Binarios do PostgreSQL embutido (uma vez por maquina)
        run: |
          set -euo pipefail
          LAB="$HOME/.canario/laboratorio-significado"
          mkdir -p "$LAB"
          cp ferramentas/laboratorio_significado/package.json "$LAB/"
          cp ferramentas/laboratorio_significado/package-lock.json "$LAB/"
          cd "$LAB" && npm install --no-audit --no-fund

      - name: P24, A57, A58 e portao final num banco de verdade
        run: node ferramentas/laboratorio_significado/rodar.mjs

  app:
    name: App (Swift)
    # A lógica pura termina em cerca de um minuto no macOS gerenciado. Build e
    # UI completos ficam no Xcode Cloud, que tem franquia separada e usa o
    # scheme compartilhado protegido por teste no job Python acima.
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Logica pura em macOS
        working-directory: app
        run: swift test
