name: Testes

# Roda a cada push e em cada PR. Existe porque suite que so roda quando alguem
# lembra e suite que falha em silencio -- e o projeto ja teve tres bugs que os
# testes teriam pego se estivessem rodando sozinhos.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  coletores:
    name: Coletores (Python)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: '3.11'
      - name: Instalar pyyaml (usado pelo teste de workflows)
        run: pip install --quiet pyyaml
      - name: Matcher compartilhado
        run: python3 coletor/teste_matcher.py
      - name: Classificador de categorias
        run: python3 coletor/teste_classificador.py
      - name: Lista negra de vocabulario (§6)
        run: python3 coletor/teste_vocabulario.py
      - name: Normalizador de tamanhos (§24)
        run: python3 coletor/teste_tamanhos.py
      - name: Filtro de populacao (nome da marca, acessorio)
        run: python3 coletor/teste_populacao.py
      - name: Materializacao nao apaga estado medido
        run: python3 coletor/teste_materializacao.py
      - name: Estado final das migrations
        run: python3 coletor/teste_migrations.py
      - name: Publicacao atomica do motor
        run: python3 coletor/teste_publicacao_motor.py
      - name: Portao operacional de saude
        run: python3 coletor/teste_saude.py
      - name: Paginacao VTEX sem perda por empate de preco
        run: python3 coletor/teste_paginacao_vtex.py
      - name: Planejamento diario do Google Trends
        run: python3 coletor/teste_trends.py
      - name: Fila da perna de busca (§19)
        run: python3 coletor/teste_fila_de_busca.py
      # O deslocamento de seis dias entre busca e editorial nao levantava
      # excecao e nao quebrava teste: o numero existia e parecia razoavel, so
      # media outro periodo. Este confere que as duas pernas usam o mesmo
      # calendario, comparando com a funcao real do coletor editorial.
      - name: Busca e editorial na mesma semana (§22)
        run: python3 coletor/teste_semana_da_busca.py
      - name: Workflows do Actions
        run: python3 coletor/teste_workflows.py
      - name: Contrato do avaliador Luna (sem rede)
        run: python3 coletor/teste_avaliar_luna.py
      - name: Pacote cego de revisao Luna (sem rede)
        run: python3 coletor/teste_preparar_revisao_luna.py
      - name: Consolidacao humana do Luna (sem rede)
        run: python3 coletor/teste_consolidar_revisao_luna.py
      - name: Modulos compilam
        run: python3 -m py_compile coletor/*.py
      # `py_compile` acima confere SINTAXE. Nome usado e nunca definido passa
      # limpo por ele e so estoura em execucao -- foi assim que `ja_tem` chegou
      # ao runner em 05/08 e derrubou a coleta de busca depois de meia hora de
      # trabalho ja feito.
      - name: Nome usado e nunca definido
        run: python3 coletor/teste_nomes.py

  app:
    name: App (Swift)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Logica pura em macOS
        working-directory: app
        run: swift test
      # O Config.xcconfig real esta no .gitignore (contem a chave). Para o CI
      # so precisamos que o arquivo EXISTA, porque o projeto o referencia como
      # base de configuracao -- sem ele o build falha antes de compilar. Os
      # valores de exemplo bastam: aqui nao se conecta a servidor nenhum.
      - name: Config de exemplo para o build
        working-directory: app
        run: cp ../Config.xcconfig.example ../Config.xcconfig

      - name: Compilar para o simulador
        working-directory: app
        run: |
          xcodebuild -project Canario.xcodeproj -target Canario \
            -sdk iphonesimulator -configuration Debug build \
            CODE_SIGNING_ALLOWED=NO | tail -5
