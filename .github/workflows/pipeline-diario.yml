name: Pipeline diario (coletas, motor e saude)

# Um unico disparo fixa o mesmo commit e expressa dependencias reais. Horario
# deixa de ser mecanismo de coordenacao: se uma coleta atrasar, a seguinte
# espera; se falhar, o motor nao publica uma semana parcial.
on:
  workflow_dispatch:
  schedule:
    # 03:00 BRT = 06:00 UTC (Brasil sem horario de verao desde 2019).
    - cron: '0 6 * * *'

permissions:
  contents: write

concurrency:
  group: pipeline-diario
  cancel-in-progress: false

jobs:
  varejo-vtex:
    uses: ./.github/workflows/coleta.yml
    with:
      marca: ''
    secrets: inherit

  varejo-shopify:
    needs: varejo-vtex
    uses: ./.github/workflows/coleta-shopify.yml
    secrets: inherit

  editorial:
    needs: varejo-shopify
    uses: ./.github/workflows/coleta-editorial.yml
    secrets: inherit

  busca:
    needs: editorial
    uses: ./.github/workflows/coleta-trends.yml
    with:
      modo: ''
    secrets: inherit

  saude-inicial:
    # Mede antes de recuperar, mas nao publica nem deixa a run vermelha: esse
    # resultado decide se as fontes externas precisam de uma segunda chance.
    if: ${{ always() }}
    needs: [varejo-vtex, varejo-shopify, editorial, busca]
    outputs:
      saudavel: ${{ steps.resultado.outputs.saudavel }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: '3.11'

      - name: Consolidar fontes e aplicar portao de saude
        id: portao
        continue-on-error: true
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
        run: python3 coletor/gerar_saude.py

      - name: Validar execucao das quatro coletas
        id: dependencias
        if: >-
          ${{ !(needs.varejo-vtex.result == 'success' &&
                needs.varejo-shopify.result == 'success' &&
                needs.editorial.result == 'success' &&
                needs.busca.result == 'success') }}
        continue-on-error: true
        run: exit 1

      - name: Expor resultado inicial
        id: resultado
        if: ${{ always() }}
        run: |
          echo "saudavel=${{ steps.portao.outcome == 'success' && steps.dependencias.outcome != 'failure' }}" >> "$GITHUB_OUTPUT"

  recuperar-shopify:
    needs: saude-inicial
    if: ${{ needs.saude-inicial.outputs.saudavel != 'true' }}
    uses: ./.github/workflows/coleta-shopify.yml
    secrets: inherit

  recuperar-busca:
    needs: [saude-inicial, recuperar-shopify]
    if: ${{ always() && needs.saude-inicial.outputs.saudavel != 'true' }}
    runs-on: ubuntu-latest
    steps:
      - name: Não repetir automaticamente uma fonte semanal que recusou
        run: >-
          echo "A causa registrada segue para o portão; a recuperação do
          Trends é manual e ocorre numa janela posterior."

  saude:
    # O portao final continua estrito. A recuperacao melhora os dados; nao
    # muda limiar, nao mascara ausencia e nao libera motor com fonte parcial.
    if: ${{ always() }}
    needs: [saude-inicial, recuperar-shopify, recuperar-busca]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: '3.11'

      - name: Consolidar fontes e aplicar portao final de saude
        id: portao
        continue-on-error: true
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
        run: python3 coletor/gerar_saude.py

      - name: Publicar relatorio unico
        if: ${{ always() && github.ref_name == 'main' }}
        run: >-
          bash .github/commitar.sh "SAUDE.md" "Saude consolidada do pipeline"

      - name: Bloquear publicacao do motor
        if: ${{ steps.portao.outcome == 'failure' }}
        run: exit 1

  motor:
    needs: saude
    # Condicao explicita: `success()` implicito herda jobs ancestrais pulados
    # (as recuperacoes quando a primeira saude passa) e pularia o motor verde.
    if: ${{ always() && needs.saude.result == 'success' }}
    uses: ./.github/workflows/motor.yml
    with:
      backfill_editorial: false
    secrets: inherit
