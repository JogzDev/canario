name: Pipeline diario (coletas, motor e saude)

# Um unico disparo fixa o mesmo commit e expressa dependencias reais. Horario
# deixa de ser mecanismo de coordenacao: se uma coleta atrasar, a seguinte
# espera; se falhar, o motor nao publica uma semana parcial.
#
# QUEM DISPARA (A63, 23/09/2026)
# O agendamento do GitHub atrasou de 3,5 a 5 horas de 19 a 23/09 e nem nasceu
# em 21/09. O disparo diario saiu dele: o pg_cron do Supabase, o mesmo que ja
# despacha o motor a cada minuto, pede esta execucao as 03:17 BRT
# (`disparar_pipeline_diario`) e vigia ao meio-dia (`vigiar_pipeline_diario`).
# O GitHub ficou de reserva em `gatilho-reserva.yml`, que so dispara se o dia
# ainda nao tiver execucao -- aqui nao ha cron, para nao correr duas vezes.
on:
  workflow_dispatch:

permissions:
  contents: write
  # Para o alerta abrir e fechar a issue de incidente. Ate 19/08/2026 nao havia
  # canal nenhum: cinco execucoes vermelhas seguidas passaram em silencio,
  # porque a falha so aparecia na lista de execucoes do Actions.
  issues: write

concurrency:
  group: pipeline-diario
  cancel-in-progress: false

jobs:
  varejo-vtex:
    uses: ./.github/workflows/coleta.yml
    with:
      marca: ''
      # O pente fino e diagnostico manual. Chamado por um pipeline disparado
      # (workflow_dispatch), o default `true` o faria rodar todo dia.
      pente_fino: false
    secrets: inherit

  varejo-shopify:
    needs: varejo-vtex
    uses: ./.github/workflows/coleta-shopify.yml
    with:
      data_operacional: ${{ needs.varejo-vtex.outputs.data_operacional }}
    secrets: inherit

  editorial:
    needs: varejo-shopify
    uses: ./.github/workflows/coleta-editorial.yml
    with:
      data_operacional: ${{ needs.varejo-shopify.outputs.data_operacional }}
    secrets: inherit

  busca:
    needs: editorial
    uses: ./.github/workflows/coleta-trends.yml
    with:
      modo: ''
      data_operacional: ${{ needs.editorial.outputs.data_operacional }}
    secrets: inherit

  saude-inicial:
    # Mede antes de recuperar, mas nao publica nem deixa a run vermelha: esse
    # resultado decide se as fontes externas precisam de uma segunda chance.
    if: ${{ always() }}
    needs: [varejo-vtex, varejo-shopify, editorial, busca]
    outputs:
      saudavel: ${{ steps.resultado.outputs.saudavel }}
      data_operacional: ${{ needs.varejo-vtex.outputs.data_operacional }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - uses: ./.github/actions/python-mac

      - name: Consolidar fontes e aplicar portao de saude
        id: portao
        continue-on-error: true
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
          DATA_OPERACIONAL: ${{ needs.varejo-vtex.outputs.data_operacional }}
        run: "$PY coletor/gerar_saude.py"

      - name: Validar execucao das quatro coletas
        id: dependencias
        if: >-
          ${{ !(needs.varejo-vtex.result == 'success' &&
                needs.varejo-shopify.result == 'success' &&
                needs.editorial.result == 'success' &&
                needs.busca.result == 'success') }}
        continue-on-error: true
        run: exit 1

      - name: Expor resultado inicial
        id: resultado
        if: ${{ always() }}
        run: |
          echo "saudavel=${{ steps.portao.outcome == 'success' && steps.dependencias.outcome != 'failure' }}" >> "$GITHUB_OUTPUT"

  recuperar-shopify:
    needs: saude-inicial
    if: ${{ needs.saude-inicial.outputs.saudavel != 'true' }}
    uses: ./.github/workflows/coleta-shopify.yml
    with:
      data_operacional: ${{ needs.saude-inicial.outputs.data_operacional }}
    secrets: inherit

  recuperar-busca:
    needs: [saude-inicial, recuperar-shopify]
    if: ${{ always() && needs.saude-inicial.outputs.saudavel != 'true' }}
    runs-on: ubuntu-latest
    steps:
      - name: Não repetir automaticamente uma fonte semanal que recusou
        run: >-
          echo "A causa registrada segue para o portão; a recuperação do
          Trends é manual e ocorre numa janela posterior."

  saude:
    # O portao final continua estrito. A recuperacao melhora os dados; nao
    # muda limiar, nao mascara ausencia e nao libera motor com fonte parcial.
    if: ${{ always() }}
    needs: [saude-inicial, recuperar-shopify, recuperar-busca]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - uses: ./.github/actions/python-mac

      - name: Consolidar fontes e aplicar portao final de saude
        id: portao
        continue-on-error: true
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
          DATA_OPERACIONAL: ${{ needs.saude-inicial.outputs.data_operacional }}
        run: "$PY coletor/gerar_saude.py"

      # Relatorio e portao sao responsabilidades diferentes. A `main` exige
      # PR, portanto tentar commitar SAUDE.md daqui deixava a saude vermelha
      # mesmo depois de `gerar_saude.py` declarar todas as fontes saudaveis --
      # e, por dependencia, pulava o motor. O relatorio agora acompanha a run;
      # falha de apresentacao nunca pode mudar o veredito dos dados.
      - name: Expor relatorio na propria execucao
        if: ${{ always() }}
        continue-on-error: true
        run: |
          if [[ -s SAUDE.md ]]; then
            cat SAUDE.md >> "$GITHUB_STEP_SUMMARY"
          else
            echo '## Saude — relatorio nao gerado' >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Guardar relatorio para download
        if: ${{ always() }}
        continue-on-error: true
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: saude-${{ github.run_id }}-${{ github.run_attempt }}
          path: SAUDE.md
          if-no-files-found: warn
          retention-days: 30

      - name: Bloquear publicacao do motor
        if: ${{ steps.portao.outcome == 'failure' }}
        run: exit 1

  motor:
    needs: saude
    # Condicao explicita: `success()` implicito herda jobs ancestrais pulados
    # (as recuperacoes quando a primeira saude passa) e pularia o motor verde.
    if: ${{ always() && needs.saude.result == 'success' }}
    uses: ./.github/workflows/motor.yml
    with:
      backfill_editorial: false
    secrets: inherit

  publicacao:
    # Motor concluído pode retornar observacoes_publicadas=0: o SQL mantém a
    # âncora antiga quando falta cobertura. Só a leitura pública comprova o
    # dia disponível ao app; não repetir coletas nem flexibilizar a coorte.
    needs: [motor, saude-inicial]
    if: ${{ always() && needs.motor.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: ./.github/actions/python-mac
      - name: Confirmar o dia publicado pela API do app
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_PUBLISHABLE_KEY: ${{ secrets.SUPABASE_PUBLISHABLE_KEY }}
          DATA_OPERACIONAL: ${{ needs.saude-inicial.outputs.data_operacional }}
        run: >-
          "$PY" coletor/sonda_significado_publico.py --exigir-publicacao
          --data-operacional "$DATA_OPERACIONAL" --relatorio publicacao-painel.json

      - name: Guardar diagnóstico mesmo sem atualização
        if: ${{ always() }}
        continue-on-error: true
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: publicacao-painel-${{ github.run_id }}-${{ github.run_attempt }}
          path: publicacao-painel.json
          if-no-files-found: warn
          retention-days: 30

  verificacao-final:
    # Fecha no próprio executor hospedado o portão que antes dependia do
    # supervisor do Mac: capacidade depois de TODAS as escritas e isolamento.
    needs: publicacao
    if: ${{ always() && needs.publicacao.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: ./.github/actions/python-mac
      - name: Exigir capacidade em até 85% depois da publicação
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
          CAPACIDADE_MAXIMA_PCT: '85'
        run: "$PY coletor/verificar_capacidade_banco.py"
      - name: Provar que a direção internacional segue isolada
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
          SEGMENTO_VERIFICADO: direcao_intl
        run: "$PY coletor/verificar_isolamento_segmento.py"

  alerta:
    # Ultimo job, sempre. Abre UMA issue por incidente, comenta nela nas noites
    # seguintes e fecha sozinho no primeiro verde -- assim "issue aberta"
    # significa "esta quebrado agora", e dia bom nao notifica ninguem.
    #
    # Também roda hospedado: computador pessoal desligado deixa de ser ponto
    # cego. Esgotar a franquia ainda impede o job de começar e deve ser
    # acompanhado pelo orçamento mensal de minutos.
    if: ${{ always() && github.ref_name == 'main' }}
    needs: [varejo-vtex, varejo-shopify, editorial, busca, saude, motor, publicacao, verificacao-final]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Avisar alguem
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ESTADO_DO_PIPELINE: >-
            ${{ (needs.saude.result == 'success' &&
                 needs.motor.result == 'success' &&
                 needs.publicacao.result == 'success' &&
                 needs.verificacao-final.result == 'success') && 'verde' || 'vermelho' }}
          JOBS_QUE_FALHARAM: >-
            varejo-vtex=${{ needs.varejo-vtex.result }}
            varejo-shopify=${{ needs.varejo-shopify.result }}
            editorial=${{ needs.editorial.result }}
            busca=${{ needs.busca.result }}
            saude=${{ needs.saude.result }}
            motor=${{ needs.motor.result }}
            publicacao=${{ needs.publicacao.result }}
            verificacao-final=${{ needs.verificacao-final.result }}
        run: python3 ferramentas/alertar.py
